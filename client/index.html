<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇩🇪</text></svg>">
    <!-- start_url "/" so a home-screen icon always opens on Today, whatever page it was saved from. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="AzubiWeg is a Germany-prep platform: a German vocabulary manager with spaced-repetition review synced to Obsidian, a Job Search page (application kanban tracker with a CV shelf), a document checklist, and a day-by-day CEFR study roadmap."
    />
    <title>AzubiWeg</title>
    <script>
      (function () {
        // Pre-mount theme resolution, mirrored exactly from
        // client/src/lib/theme.tsx (explicit localStorage override, else the
        // OS preference) so there's no flash of the wrong theme before React
        // mounts. Sets data-theme, which index.css's Bento tokens key off.
        var stored = null;
        try {
          stored = localStorage.getItem("azubiweg-theme");
        } catch (e) {}
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <script>
      (function (c, l, a, r, i, t, y) {
        c[a] =
          c[a] ||
          function () {
            (c[a].q = c[a].q || []).push(arguments);
          };
        t = l.createElement(r);
        t.async = 1;
        t.src = "https://www.clarity.ms/tag/" + i;
        y = l.getElementsByTagName(r)[0];
        y.parentNode.insertBefore(t, y);
      })(window, document, "clarity", "script", "xqw43txtz2");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
