<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇩🇪</text></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="AzubiWeg is a Germany-prep platform: a German vocabulary manager with spaced-repetition review synced to Obsidian, a Job Search page (application kanban tracker with a CV shelf), a document checklist, and a day-by-day CEFR study roadmap."
    />
    <title>AzubiWeg</title>
    <script>
      (function () {
        // Pre-mount theme resolution, mirrored exactly from
        // client/src/lib/theme.tsx's resolveInitialTheme() so there's no
        // flash of the wrong theme before React hydrates. Sets data-theme
        // (Nocturne v2's light/dark switch — see index.css), not the old
        // pre-Nocturne .dark class, which no CSS reads any more.
        var stored = localStorage.getItem("azubiweg-theme");
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <script>
      (function (c, l, a, r, i, t, y) {
        c[a] =
          c[a] ||
          function () {
            (c[a].q = c[a].q || []).push(arguments);
          };
        t = l.createElement(r);
        t.async = 1;
        t.src = "https://www.clarity.ms/tag/" + i;
        y = l.getElementsByTagName(r)[0];
        y.parentNode.insertBefore(t, y);
      })(window, document, "clarity", "script", "xqw43txtz2");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
